<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070b16">
<title>Mohamed Mostafa Atwa | Digital Card</title>
<style>
:root{--bg:#070b16;--card:rgba(16,23,42,.82);--line:rgba(255,255,255,.12);--text:#f7f9ff;--muted:#aab4c8;--accent:#63e6be;--accent2:#74c0fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#12334a 0,transparent 32%),radial-gradient(circle at 85% 80%,#18244e 0,transparent 35%),var(--bg);display:flex;justify-content:center;align-items:center;padding:24px 16px}
.wrap{width:min(430px,100%)}
.card{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(18px);border-radius:30px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.38)}
.glow{position:absolute;width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));filter:blur(70px);opacity:.18;right:-60px;top:-60px}
.profile{text-align:center;position:relative}
.photo{width:118px;height:118px;border-radius:34px;object-fit:cover;object-position:center;border:2px solid rgba(255,255,255,.22);box-shadow:0 12px 34px rgba(0,0,0,.32)}
.name{font-size:27px;font-weight:800;letter-spacing:-.6px;margin:17px 0 4px}
.role{margin:0;color:var(--muted);font-size:14px}
.tag{display:inline-flex;gap:7px;align-items:center;margin-top:12px;padding:7px 10px;border:1px solid rgba(99,230,190,.22);background:rgba(99,230,190,.08);border-radius:999px;color:#b9f7e5;font-size:11px;font-weight:700}
.tag span{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.links{position:relative;margin-top:27px;display:grid;gap:10px}
.btn{display:flex;justify-content:center;align-items:center;gap:10px;padding:15px 14px;border-radius:16px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:13px;font-weight:750;background:rgba(255,255,255,.045);transition:.2s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.09)}
.primary{background:linear-gradient(135deg,rgba(99,230,190,.20),rgba(116,192,252,.15));border-color:rgba(99,230,190,.25)}
.ai{margin-top:18px;text-align:center;color:#7f8aa0;font-size:10px}
.ai b{color:#aeb9cc}
@media(max-width:380px){.card{padding:23px}.photo{width:100px;height:100px}.name{font-size:23px}}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<div class="glow"></div>

<div class="profile">
<img class="photo" src="profile.png" alt="Mohamed Mostafa Atwa">
<h1 class="name">Mohamed Mostafa Atwa</h1>
<p class="role">HR • Computer Engineer</p>
<div class="tag"><span></span> Digital Business Card</div>
</div>

<div class="links">
<a class="btn primary" href="tel:+201205224072">☎ Call Me</a>
<a class="btn primary" href="https://wa.me/201205224072" target="_blank" rel="noopener">◉ WhatsApp</a>
<a class="btn" href="mailto:mohamedmostafaatwa192@gmail.com">✉ Email</a>
<a class="btn" href="https://www.facebook.com/ahmed.hamo2014" target="_blank" rel="noopener">f Facebook</a>
<a class="btn" href="https://www.instagram.com/mr.3twa?stkn=OHprOHNteHE4YWMy" target="_blank" rel="noopener">◎ Instagram</a>
</div>

<div class="ai">✦ <b>Designed & developed with AI assistance</b></div>
</section>
</main>
</body>
</html>
